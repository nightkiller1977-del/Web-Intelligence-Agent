name: Sidecar Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README.md states Python 3.11+ as the minimum supported version;
        # 3.12 matches this project's local development interpreter.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      - name: Run test suite (excluding SSRF/egress security tests)
        run: pytest --cov=app --ignore=tests/test_security_egress.py -v

  security-egress-test:
    name: pytest security egress (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # These tests assert that outbound SSRF/egress protection blocks unsafe
    # requests at the requests/httpx/aiohttp/socket layer *before* any
    # connection attempt leaves the process (see app/security.py's patched
    # Session.send / Client.send / socket.connect wrappers, which raise
    # PermissionError and never invoke the original network call in the
    # blocked case). An ambient CI proxy could otherwise change how those
    # clients resolve/route a request before our guard has a chance to
    # intercept it, so this job runs with no proxy configured to keep the
    # security assertions deterministic and independent of the runner's
    # network environment.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      # A step (not a job-level `env:` map) because GitHub's schema treats
      # env keys as case-insensitive — HTTP_PROXY/http_proxy in the same
      # `env:` block is a duplicate-key error that invalidates the whole
      # workflow file. $GITHUB_ENV lines aren't YAML mapping keys, so both
      # casings can be cleared here without that restriction.
      - name: Clear proxy env vars for deterministic egress assertions
        run: |
          {
            echo "HTTP_PROXY="
            echo "HTTPS_PROXY="
            echo "http_proxy="
            echo "https_proxy="
          } >> "$GITHUB_ENV"

      - name: Run SSRF/egress security tests
        run: pytest tests/test_security_egress.py --cov=app -v

  live-integration-test:
    name: Live Render integration test
    runs-on: ubuntu-latest
    # Only run on push to main — secrets are not forwarded to pull_request
    # jobs from forked repositories, and hitting production on every PR
    # branch would be wasteful and racy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, security-egress-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      # The free-tier container spins down after inactivity. Retry for up to
      # 90 s so the tests don't race a container that is still booting.
      - name: Wake Render service (cold-start)
        run: |
          for i in $(seq 1 18); do
            if curl -sf --max-time 5 "$RENDER_SERVICE_URL/health/live" > /dev/null; then
              echo "Service is up after attempt $i"
              exit 0
            fi
            echo "Attempt $i/18: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Service did not respond within 90s"
          exit 1
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}

      - name: Run live Render integration tests
        run: pytest tests/test_remote_mode.py::TestLiveRenderDeployment -v --tb=short
        timeout-minutes: 5
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
          WEB_INTELLIGENCE_AUTH_TOKEN: ${{ secrets.WEB_INTELLIGENCE_AUTH_TOKEN }}
