name: Sidecar Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # README.md states Python 3.11+ as the minimum supported version;
        # 3.12 matches this project's local development interpreter.
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      - name: Run test suite (excluding SSRF/egress security tests)
        run: pytest --cov=app --ignore=tests/test_security_egress.py -v

  security-egress-test:
    name: pytest security egress (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # These tests assert that outbound SSRF/egress protection blocks unsafe
    # requests at the requests/httpx/aiohttp/socket layer *before* any
    # connection attempt leaves the process (see app/security.py's patched
    # Session.send / Client.send / socket.connect wrappers, which raise
    # PermissionError and never invoke the original network call in the
    # blocked case). An ambient CI proxy could otherwise change how those
    # clients resolve/route a request before our guard has a chance to
    # intercept it, so this job runs with no proxy configured to keep the
    # security assertions deterministic and independent of the runner's
    # network environment.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      # A step (not a job-level `env:` map) because GitHub's schema treats
      # env keys as case-insensitive — HTTP_PROXY/http_proxy in the same
      # `env:` block is a duplicate-key error that invalidates the whole
      # workflow file. $GITHUB_ENV lines aren't YAML mapping keys, so both
      # casings can be cleared here without that restriction.
      - name: Clear proxy env vars for deterministic egress assertions
        run: |
          {
            echo "HTTP_PROXY="
            echo "HTTPS_PROXY="
            echo "http_proxy="
            echo "https_proxy="
          } >> "$GITHUB_ENV"

      - name: Run SSRF/egress security tests
        run: pytest tests/test_security_egress.py --cov=app -v

  # Removed: the "Live Render integration test" job. It probed the pre-Azure
  # Render deployment via RENDER_SERVICE_URL, which stopped responding at the
  # 2026-09-24 Azure Container Apps migration (ACES-453). Its effect on main
  # was not a detection: every sidecar-tests run on main from 2026-09-23
  # onward failed on this job's wake step alone while the real test jobs and
  # the Azure deploy both passed — a red main that tested nothing still live.
  #
  # It was not a cold start. render.yaml pins plan: standard (no spin-down),
  # so a 90 s wake loop that never succeeds means the target is gone, not
  # booting. Deleting it rather than leaving it skipped because a permanently
  # red check trains people to ignore main's status.
  #
  # The same live integration suite now runs against Azure after the new
  # revision becomes healthy, preserving public ingress, authentication,
  # /v1/research, and /capabilities coverage without a second implementation.

  # ACES-453: deploy the built image to Azure Container Apps after CI passes
  # on main. OIDC federated auth (no stored client secret) via a service
  # principal scoped to rg-aicc-fleet only — see
  # AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID repo secrets.
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: [test, security-egress-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-web-intelligence-agent
      cancel-in-progress: false
    env:
      RESOURCE_GROUP: rg-aicc-fleet
      APP_NAME: web-intelligence-agent
      ACR_NAME: aiccfleetacr
      IMAGE_NAME: web-intelligence-agent
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade -y

      - name: Build image (az acr build)
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "IMAGE_TAG=sha-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "REVISION_SUFFIX=gh${SHORT_SHA}" >> "$GITHUB_ENV"
          az acr build \
            --registry "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            --file ./Dockerfile \
            .

      - name: Update Container App revision
        run: |
          set -euo pipefail
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            --revision-suffix "$REVISION_SUFFIX"

      - name: Wait for new revision to report healthy
        run: |
          set -euo pipefail
          REVISION_NAME="${APP_NAME}--${REVISION_SUFFIX}"
          echo "Waiting on revision: $REVISION_NAME"
          for i in $(seq 1 30); do
            RUNNING_STATE=$(az containerapp revision show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.runningState" -o tsv 2>/dev/null || echo "Pending")
            HEALTH_STATE=$(az containerapp revision show \
              --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
              --revision "$REVISION_NAME" \
              --query "properties.healthState" -o tsv 2>/dev/null || echo "Pending")
            echo "Attempt $i/30: running=$RUNNING_STATE health=$HEALTH_STATE"
            case "$RUNNING_STATE" in
              Running|RunningAtMaxScale|RunningAtMinScale)
                if [ "$HEALTH_STATE" = "Healthy" ]; then
                  echo "Revision is healthy."
                  exit 0
                fi
                ;;
            esac
            if [ "$RUNNING_STATE" = "Failed" ] || [ "$RUNNING_STATE" = "Degraded" ] || [ "$HEALTH_STATE" = "Unhealthy" ]; then
              echo "Revision reported unhealthy/failed. Recent logs:"
              az containerapp logs show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$REVISION_NAME" --tail 100 || true
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for revision to report healthy."
          exit 1

      # The revision-health wait above only reads Azure control-plane state; it
      # never exercises the deployed app's public ingress. This step hits the
      # running revision's public FQDN so a container that Azure reports healthy
      # but that cannot actually serve /health/live still fails the deploy
      # (replacement for the retired Render job's public-ingress coverage).
      - name: Smoke-test public ingress on the new revision
        run: |
          set -euo pipefail
          FQDN=$(az containerapp show \
            --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          if [ -z "$FQDN" ] || [ "$FQDN" = "None" ]; then
            echo "Container App has no public ingress FQDN; cannot smoke-test."
            exit 1
          fi
          LIVE_SERVICE_URL="https://$FQDN"
          echo "LIVE_SERVICE_URL=$LIVE_SERVICE_URL" >> "$GITHUB_ENV"
          echo "Smoke-testing $LIVE_SERVICE_URL/health/live"
          for i in $(seq 1 12); do
            if curl -sf --max-time 5 "$LIVE_SERVICE_URL/health/live"; then
              echo
              echo "Public ingress is serving /health/live."
              exit 0
            fi
            echo "Attempt $i/12: not ready yet, retrying in 5s..."
            sleep 5
          done
          echo "Public ingress did not serve /health/live."
          exit 1

      - name: Set up Python 3.12 for live integration tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.txt

      - name: Install live integration test dependencies
        run: pip install -r requirements.lock -r requirements-test.txt

      - name: Run live Azure integration tests
        run: pytest tests/test_remote_mode.py::TestLiveDeployment -v --tb=short
        timeout-minutes: 5
        env:
          WEB_INTELLIGENCE_AUTH_TOKEN: ${{ secrets.WEB_INTELLIGENCE_AUTH_TOKEN }}
