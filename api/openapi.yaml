openapi: 3.0.3
info:
  title: Web Intelligence Sidecar API
  description: API Wrapper exposing GPT Researcher to AI Commander Control Plane
  version: 1.0.0
paths:
  /health/live:
    get:
      summary: Liveness probe
      description: Check if the sidecar process is alive and responsive.
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health/ready:
    get:
      summary: Readiness probe
      description: Probe connection status to storage backends and token configuration.
      responses:
        '200':
          description: All dependencies ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  gpt_researcher:
                    type: boolean
                  storage:
                    type: boolean
                  auth:
                    type: boolean
  /version:
    get:
      summary: Version information
      responses:
        '200':
          description: Version metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  serviceVersion:
                    type: string
                  protocolVersion:
                    type: string
                  engine:
                    type: object
                    properties:
                      name:
                        type: string
                      version:
                        type: string
  /capabilities:
    get:
      summary: Supported capabilities list
      description: Capability booleans report the implemented adapter surface. Structured evidence, claim verification, source policies, model budget limits, and model preferences are currently unsupported.
      responses:
        '200':
          description: Capabilities metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  service:
                    type: string
                  version:
                    type: string
                  protocol_version:
                    type: string
                  capabilities:
                    type: object
                    additionalProperties:
                      type: boolean
  /v1/research:
    post:
      summary: Submit a research request
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Deterministic idempotency key. Required when idempotencyKey is omitted from the JSON body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - operationId
                - attemptId
                - query
                - limits
              properties:
                operationId:
                  type: string
                idempotencyKey:
                  type: string
                  description: Deterministic idempotency key. Optional when the Idempotency-Key header is provided.
                attemptId:
                  type: string
                query:
                  type: string
                mode:
                  type: string
                  enum: [quick, standard, deep]
                profile:
                  type: string
                sourcePolicy:
                  type: object
                  description: Unsupported by the GPT Researcher adapter. Requests including this field are rejected.
                requireClaimVerification:
                  type: boolean
                  description: Unsupported by the GPT Researcher adapter.
                model_provider:
                  type: string
                  description: Unsupported by the GPT Researcher adapter. Configure provider defaults through environment variables.
                model_name:
                  type: string
                  description: Unsupported by the GPT Researcher adapter. Configure model defaults through environment variables.
                limits:
                  type: object
                  required:
                    - maximumDurationSeconds
                    - maximumSearches
                    - maximumPages
                    - maximumSources
                  properties:
                    maximumDurationSeconds:
                      type: integer
                    maximumSearches:
                      type: integer
                    maximumPages:
                      type: integer
                    maximumSources:
                      type: integer
                    maximumMemoryMb:
                      type: integer
                      description: Per-operation memory guardrail in MB.
                    maximumModelCalls:
                      type: integer
                      description: Unsupported by the GPT Researcher adapter. Requests including this field are rejected.
                    maximumModelTokens:
                      type: integer
                      description: Unsupported by the GPT Researcher adapter. Requests including this field are rejected.
                    maximumModelCostUsd:
                      type: number
                      format: float
                      description: Unsupported by the GPT Researcher adapter. Requests including this field are rejected.
      responses:
        '202':
          description: Research operation queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
                    example: queued
  /v1/research/{operationId}/events:
    get:
      summary: Subscribe to research progress events
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server-Sent Events stream of progress updates
          content:
            text/event-stream:
              schema:
                type: string
  /v1/research/{operationId}/result:
    get:
      summary: Fetch finalized structured research result
      description: Returns the synthesized answer, source URLs, metrics, and adapter limitations. Passage-level evidence, claims, and citation graph arrays are currently empty because the adapter does not expose stable passage-level data.
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Structured result payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
                  answer:
                    type: string
                  sources:
                    type: array
                    items:
                      type: object
                  evidence:
                    type: array
                    items:
                      type: object
                  claims:
                    type: array
                    items:
                      type: object
                  citations:
                    type: array
                    items:
                      type: object
  /v1/research/{operationId}/cancel:
    post:
      summary: Request active research operation cancellation
      parameters:
        - name: operationId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation request processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId:
                    type: string
                  status:
                    type: string
                    example: cancelled
